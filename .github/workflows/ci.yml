name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check server JavaScript syntax
        run: find . -path ./node_modules -prune -o -path ./public/js -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Check browser module syntax
        run: |
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find public/js -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run tests
        run: npm test
      # archiver@7 的传递依赖（glob / minimatch）目前只有 moderate 级公告，且只能在
      # 本地生成 ZIP 时触发。升级到 archiver@8 需要迁移到 ESM 与新 API，单独安排；
      # 这里仍然阻断 high / critical，避免长期红灯让人忽略真正的失败。
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container-smoke:
    name: Container deployment smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag moonbox-ci:${{ github.sha }} .
      - name: Verify writes against a legacy bind mount
        run: bash tests/container-smoke.sh moonbox-ci:${{ github.sha }}
